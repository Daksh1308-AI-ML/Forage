version: "3.8"

services:
  forge-agi:
    build: .
    container_name: forge-agi
    ports:
      - "8000:8000"
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_started
    networks:
      - forge-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: forge-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - forge-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: forge-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - forge-agi
    networks:
      - forge-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: forge-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    volumes:
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana-dashboard.json:/etc/grafana/provisioning/dashboards/forge-agi.json:ro
    depends_on:
      - prometheus
    networks:
      - forge-network
    restart: unless-stopped

networks:
  forge-network:
    driver: bridge
